name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This sets up the Gradle environment and automatically runs the build
      - name: Setup and Build with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: FlashDance
          arguments: assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-dance-debug-apk
          path: FlashDance/app/build/outputs/apk/debug/app-debug.apk
