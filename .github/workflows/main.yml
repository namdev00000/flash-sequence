name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# This tells GitHub to run all commands inside the FlashDance folder
defaults:
  run:
    working-directory: FlashDance

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-dance-debug-apk
          # We point to the project subfolder to find the finished APK
          path: FlashDance/app/build/outputs/apk/debug/app-debug.apk
